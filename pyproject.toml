[project]
name = "riddlequest"
version = "0.1.0"
description = "Riddle Quest - A fun CLI riddle guessing game"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
riddlequest = "riddlequest.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riddlequest = ["data/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
